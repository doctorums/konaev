<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15110E;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1248px;height:832px;flex:none;transform-origin:50% 50%;overflow:hidden;
  --sky:linear-gradient(180deg,#F2C230 0%,#E39A4A 30%,#C8674A 52%,#7A5A72 75%,#33345C 100%);
  --water:linear-gradient(180deg,#3E5A78 0%,#24405E 55%,#16283E 100%);
  --sun:#FCEBB0;--sunglow:rgba(252,235,176,.5);--sunop:1;--suntop:40%;
  --hline:rgba(255,214,140,.55);--dim:rgba(24,16,8,.16)}
.lay{position:absolute;inset:0}
#stage{background:#F5EFE2 radial-gradient(ellipse at 50% 40%,#FBF7EE 0%,#F1E9D8 70%,#E8DDC6 100%)}
#stage:before{content:"";position:absolute;inset:0;z-index:0;opacity:.35;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(120,100,70,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,100,70,.04) 0 1px,transparent 1px 4px)}
#cam{position:absolute;inset:0;transform-origin:842px 466px}
#lines .fl{fill:#1E1A16}
#lines .ln{fill:none;stroke:#1E1A16;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len) var(--len);stroke-dashoffset:0;opacity:0}
.pre:not(.play) #cam{opacity:0}
.play #lines .ln{animation:draw var(--d) cubic-bezier(.4,0,.2,1) var(--t) both, lnout .8s ease 4.1s both}
.play #lines .fl{animation:flin .9s ease 2.9s both}
@keyframes draw{from{stroke-dashoffset:var(--len);opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes lnout{from{opacity:1}to{opacity:0}}
@keyframes flin{from{opacity:0}to{opacity:1}}
.play .rev:not(.lay){animation:revealR 1.2s cubic-bezier(.5,0,.3,1) 4.1s both}
.play .lay.rev{animation:reveal 1.2s cubic-bezier(.5,0,.3,1) 5.3s both}
@keyframes revealR{from{clip-path:inset(0 0 0 100%);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.play .scrin{animation:scrin .9s ease 6.3s both}
@keyframes scrin{from{opacity:0}to{opacity:1}}
.play #cam{animation:cam 3.4s cubic-bezier(.45,0,.15,1) 7.4s both}
@keyframes cam{
  0%{transform:perspective(1400px) rotateY(0deg) translate(0,0) scale(1)}
  100%{transform:perspective(1400px) rotateY(-6deg) translate(-218px,-50px) scale(3.8)}}
@media (prefers-reduced-motion: reduce){.play #lines .ln,.play #lines .fl,.play .rev,.play .scrin,.play #cam{animation:none!important}}

@keyframes loadbar{0%{width:8%}100%{width:82%}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){.bar i,.scr{animation:none!important}}
</style>

&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Golos+Text:wght@400;500;600;700&amp;family=Pixelify+Sans:wght@500;700&amp;display=swap&quot;&gt;
&lt;style&gt;
:root{
  --room:#F3EBDD; --ink:#1E1A16; --mute:#5C5348;
  --wood:#5A4531; --wood-hi:#7A5E43; --wood-edge:#2B1F14; --bezel:#151210;
  --plastic:#D9CFB8; --plastic-edge:#8E8271; --plastic-txt:#231C15; --plate:#C9BFA8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=&quot;light&quot;]){
    --room:#14100D; --ink:#F3EBDD; --mute:#B3A896;
    --wood:#3B2C1F; --wood-hi:#523E2C; --wood-edge:#180F09; --bezel:#0A0807;
    --plastic:#BFB49C; --plastic-edge:#6E6354; --plastic-txt:#1B1610; --plate:#B3A896;
  }
}
:root[data-theme=&quot;dark&quot;]{
  --room:#14100D; --ink:#F3EBDD; --mute:#B3A896;
  --wood:#3B2C1F; --wood-hi:#523E2C; --wood-edge:#180F09; --bezel:#0A0807;
  --plastic:#BFB49C; --plastic-edge:#6E6354; --plastic-txt:#1B1610; --plate:#B3A896;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--room);color:var(--ink);font-family:&#x27;Golos Text&#x27;,&#x27;Segoe UI&#x27;,Tahoma,sans-serif;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #F2C230;outline-offset:2px}
.px{font-family:&#x27;Courier New&#x27;,ui-monospace,monospace;font-weight:700}
.display{font-family:&#x27;Unbounded&#x27;,&#x27;Trebuchet MS&#x27;,sans-serif}

.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.5rem .5rem 1rem}

/* ─── корпус ─── */
.ant{display:block;width:clamp(120px,30vw,210px);margin-bottom:-6px;overflow:hidden}
.tv{
  width:100%;max-width:100%;
  display:flex;flex-direction:column;gap:.6rem;
  padding:.7rem;border-radius:20px 20px 10px 10px;
  background:linear-gradient(160deg,var(--wood-hi),var(--wood) 42%,var(--wood-edge));
  border:3px solid var(--wood-edge);
  box-shadow:0 14px 30px rgba(0,0,0,.35)
}
.tube{flex:0 0 auto;width:100%;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.bezel{width:100%;aspect-ratio:4/3;max-height:calc(100dvh - 13.5rem);padding:.5rem;border-radius:18px;background:var(--bezel);box-shadow:inset 0 2px 6px rgba(255,255,255,.08)}
.screen{position:relative;width:100%;height:100%;border-radius:36px/24px;overflow:hidden;background:#0E1A38;color:#F3EBDD;touch-action:none;box-shadow:inset 0 0 55px rgba(0,0,0,.65)}

/* ─── панель управления в корпусе ─── */
.ctrl-panel{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.7rem;padding:.25rem .7rem}
.pleft{flex:1 1 46%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.pright{flex:1 1 54%;min-width:0;max-width:13rem;display:flex;flex-direction:column;align-items:center;gap:.55rem}
.sp{display:none}

/* круглый переключатель */
.dial{position:relative;width:100%;max-width:11.6rem;aspect-ratio:1;flex:none;touch-action:none}
.dial .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 68%,var(--wood-edge) 69%)}
.tick{position:absolute;display:flex;align-items:center;gap:.22rem;padding:.1rem .15rem;border-radius:4px;background:none;cursor:pointer;
  color:var(--plate);font-size:.55rem;font-weight:700;letter-spacing:.01em;line-height:1;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.7);transition:color .25s ease,opacity .25s ease,text-shadow .25s ease;opacity:.7}
.tick.flip{flex-direction:row-reverse}
.tick.cur{color:#F2C230;opacity:1;text-shadow:0 0 8px rgba(242,194,48,.55),0 1px 0 rgba(0,0,0,.7)}
.tick.act{color:#8FD98A;opacity:1;text-shadow:0 0 8px rgba(143,217,138,.5),0 1px 0 rgba(0,0,0,.7)}
.tick.hl{color:#EDE6D6;opacity:1;text-shadow:0 0 6px rgba(237,230,214,.35),0 1px 0 rgba(0,0,0,.7)}
.legend{margin-top:.15rem;min-height:1.3rem;padding:.15rem .5rem;border-radius:4px;background:var(--wood-edge);box-shadow:inset 0 1px 3px rgba(0,0,0,.65);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#F2C230;text-align:center;text-shadow:0 0 6px rgba(242,194,48,.4)}
.legend.act{color:#8FD98A}
.mark{position:absolute;width:2px;height:7px;margin:-3.5px 0 0 -1px;border-radius:1px;background:var(--plate);opacity:.45}
.mark.cur{opacity:1;width:3px;height:10px;margin-top:-5px;margin-left:-1.5px;background:#F2C230;box-shadow:0 0 7px rgba(242,194,48,.8)}
.mark.hl{opacity:1;background:#EDE6D6;box-shadow:0 0 6px rgba(237,230,214,.5)}
.mark{transition:height .2s,opacity .2s,background .2s}
.dial.chasing .tick{transition:color .85s ease,opacity .85s ease}
.knob{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#F2EAD6,var(--plastic) 46%,#8E8271);
  border:4px solid var(--wood-edge);box-shadow:0 4px 10px rgba(0,0,0,.5);cursor:grab}
.knob:active{cursor:grabbing}
.knob i{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .22s cubic-bezier(.34,1.5,.5,1)}
.knob i:after{content:&quot;&quot;;position:absolute;left:50%;top:9%;width:4px;height:26%;margin-left:-2px;background:#2B1F14;border-radius:2px}
.knob b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:&#x27;Unbounded&#x27;,&#x27;Trebuchet MS&#x27;,sans-serif;font-weight:700;font-size:1rem;color:#2B1F14}


/* горизонтальный ползунок громкости */
.vol-slider{position:relative;width:100%;max-width:none;height:2.1rem;flex:none;border-radius:7px;background:var(--wood-edge);padding:0 .5rem;cursor:pointer;touch-action:none;display:flex;align-items:center;justify-content:space-between}
.vol-slider .track{position:absolute;left:.5rem;right:.5rem;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#120C07;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.vol-slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#B5772A,#E5B52E)}
.vol-slider .grip{position:absolute;top:50%;width:1rem;height:1.5rem;margin-top:-.75rem;border-radius:3px;background:linear-gradient(180deg,#F1E8D2,var(--plastic) 55%,#9E937E);border-bottom:2px solid var(--plastic-edge);box-shadow:0 2px 4px rgba(0,0,0,.5);transition:left .12s}
.vol-slider .grip:after{content:&quot;&quot;;position:absolute;top:4px;bottom:4px;left:50%;width:2px;margin-left:-1px;background:rgba(0,0,0,.35)}
.vol-slider span{position:relative;z-index:2;font-family:&#x27;Pixelify Sans&#x27;,&#x27;Courier New&#x27;,monospace;font-size:.6rem;color:var(--plate);opacity:.85}

/* динамик */
.grille{width:100%;max-width:none;height:2.6rem;border-radius:6px;
  background:repeating-linear-gradient(180deg,var(--wood-edge) 0 3px,rgba(255,255,255,.04) 3px 7px);
  box-shadow:inset 0 1px 4px rgba(0,0,0,.6)}

/* питание внизу */
/* компактно: динамик прячем */
.ctrl-panel.compact .grille{display:none}
.pwrow{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%}
.pw{flex:1;max-width:8rem;min-width:4.4rem;min-height:2.6rem;padding:0 .7rem;border-radius:7px;background:linear-gradient(180deg,#F1E8D2,var(--plastic) 55%,#A79B85);color:var(--plastic-txt);border-bottom:4px solid var(--plastic-edge);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.pw:active{transform:translateY(3px);border-bottom-width:1px}
.pw.is-off{background:linear-gradient(180deg,#cfc6b4,#9e937e 55%,#7a705e);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.led{width:10px;height:10px;border-radius:50%;background:#E0543C;box-shadow:0 0 7px rgba(224,84,60,.8)}
.led.off{background:#4A2018;box-shadow:none}

/* ─── содержимое экрана ─── */
.stage{position:absolute;inset:0;container-type:size;overflow:hidden}
.ch{position:relative;overflow-y:auto;overscroll-behavior:contain;gap:max(.3rem,2cqh);padding:2rem 1rem 3.2rem;padding:max(1.5rem,6cqh) max(.8rem,3.4cqw) max(2.7rem,9.5cqh);display:flex;flex-direction:column;justify-content:center;gap:.8rem}
.js .ch{position:absolute;inset:0;display:none}
.js .ch.on{display:flex}
h1,h2{margin:0;font-family:&#x27;Unbounded&#x27;,&#x27;Trebuchet MS&#x27;,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.08;color:#F2C230}
h1{font-size:clamp(1.5rem,4.6vw,3.2rem);font-size:clamp(.95rem,8.2cqh,5.5rem)}
h2{font-size:clamp(1.2rem,3.2vw,2.2rem);font-size:clamp(.88rem,6.6cqh,4rem)}

.ch p,.steps{line-height:1.35}
.ch p{margin:0;font-size:clamp(.92rem,1.8vw,1.25rem);font-size:clamp(.68rem,4cqh,2rem);max-width:52rem}
.cy{color:#5FD4D0}
.small{font-size:clamp(.6rem,3.2cqh,1.4rem)!important;color:#B9C3DD}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:max(.25rem,1.6cqh);font-size:clamp(.92rem,1.8vw,1.2rem);font-size:clamp(.66rem,3.6cqh,1.9rem);max-width:52rem}
.steps li{display:flex;gap:.5rem;align-items:baseline}
.steps b{font-family:&#x27;Pixelify Sans&#x27;,&#x27;Courier New&#x27;,monospace;color:#5FD4D0;min-width:1.3rem}
.row{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:clamp(34px,11cqh,76px);padding:0 max(.7rem,3cqw);border-radius:10px;font-weight:700;font-size:clamp(.75rem,4.6cqh,1.6rem);color:#1E1A16;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.r{background:#E0543C}.btn.g{background:#6CCB5F}.btn.y{background:#F2C230}
.card{padding:0!important;gap:0!important;flex-direction:row!important;justify-content:stretch!important}
.card .bar{flex:1}
.card .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88%,30rem);padding:1rem 1.2rem;background:#0E1A38;border:3px solid #F3EBDD;text-align:center;display:flex;flex-direction:column;gap:.5rem}
#noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none;z-index:5}
.scan{position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px)}
.osd{position:absolute;top:.5rem;right:.8rem;z-index:7;font-size:clamp(.7rem,2.7vmin,1.9rem);font-weight:700;color:#6CCB5F;text-shadow:0 0 6px rgba(108,203,95,.6);transition:opacity .4s}
.osd.hide{opacity:0}
.clock{position:absolute;top:.5rem;left:.8rem;z-index:7;font-size:clamp(.66rem,4cqh,1.7rem);color:#F3EBDD;opacity:.85}
.vol{position:absolute;left:50%;bottom:3rem;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:.5rem;color:#6CCB5F;font-size:.95rem;transition:opacity .4s}
.vol.hide{opacity:0}
.vol i{display:inline-block;width:7px;height:15px;background:#1d3a1a;margin-right:3px}
.vol i.on{background:#6CCB5F}
.crawl{position:absolute;left:0;right:0;bottom:0;z-index:4;overflow:hidden;justify-content:center;height:clamp(1.5rem,4.4vmin,3.4rem);background:#F2C230;color:#1E1A16;overflow:hidden;display:flex;align-items:center;font-weight:600;font-size:clamp(.62rem,2.3vmin,1.5rem);white-space:nowrap}
.crawl-in{display:flex;flex:none;align-items:center;white-space:nowrap;will-change:transform;
  animation:crawl 52s linear infinite;animation-play-state:running}
.crawl-in span{padding-right:3rem;flex:none}
.crawl.static .crawl-in{width:100%;justify-content:center}
.crawl.static .crawl-in span{display:none;padding:0 1rem;white-space:normal;text-align:center}
.crawl.static .crawl-in span.show{display:block}
.crawl-in .display{font-weight:700;letter-spacing:.04em}
@keyframes crawl{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.off{position:absolute;inset:0;z-index:8;background:#050505;display:none;align-items:center;justify-content:center;text-align:center;padding:1.4rem;color:#8d8577;font-size:.95rem}
.screen.is-off .off{display:flex;animation:shut .35s ease-out}
@keyframes shut{from{clip-path:inset(0 0 0 0);background:#fff}60%{clip-path:inset(49% 0 49% 0);background:#fff}to{clip-path:inset(0 0 0 0);background:#050505}}
@media (prefers-reduced-motion: reduce){
  .crawl-in{animation:none;transform:none}
  .screen.is-off .off{animation:none}
  .knob i{transition:none}
}
#err{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:#B00020;color:#fff;font:14px monospace;padding:.5rem;white-space:pre-wrap}


.set{display:flex;flex-direction:column;align-items:center;width:100%;max-width:var(--tvmax);min-width:0;min-height:0}
.legs{display:flex;justify-content:space-between;width:100%;padding:0 16%;margin-top:-2px}

window.onerror=function(m,s,l){var e=document.getElementById(&#x27;err&#x27;);e.style.display=&#x27;block&#x27;;e.textContent=&#x27;Ошибка: &#x27;+m+&#x27; (строка &#x27;+l+&#x27;)&#x27;;};
(function(){
  var screen=document.getElementById(&#x27;screen&#x27;);
  var chans=[].slice.call(document.querySelectorAll(&#x27;.ch&#x27;));
  var osd=document.getElementById(&#x27;osd&#x27;),volEl=document.getElementById(&#x27;vol&#x27;),volBars=document.getElementById(&#x27;volbars&#x27;);
  var noise=document.getElementById(&#x27;noise&#x27;),ctx=noise.getContext(&#x27;2d&#x27;);
  var reduce=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  var cur=1,busy=false,swipes=0,vol=0,ac=null,osdT=null,volT=null,backT=null,start=Date.now();

  /* позиции переключателя: 5 каналов + два действия */
  var chase=-1,chaseT=null,idleT=null;
  var POS=[
    {t:&#x27;1&#x27;,s:&#x27;главный&#x27;,go:1},
    {t:&#x27;2&#x27;,s:&#x27;подключить&#x27;,go:2},
    {t:&#x27;3&#x27;,s:&#x27;родителям&#x27;,go:3},
    {t:&#x27;4&#x27;,s:&#x27;ремонт&#x27;,go:4},
    {t:&#x27;5&#x27;,s:&#x27;важное&#x27;,go:5},
    {t:&#x27;W&#x27;,s:&#x27;WhatsApp&#x27;,msg:&#x27;WHATSAPP: НОМЕР НЕ ЗАДАН&#x27;},
    {t:&#x27;T&#x27;,s:&#x27;позвонить&#x27;,msg:&#x27;ТЕЛЕФОН: НОМЕР НЕ ЗАДАН&#x27;}
  ];
  var STEP=44, A0=-(STEP*(POS.length-1))/2, pos=0;
  var dialEl=document.getElementById(&#x27;dial&#x27;),knob=document.getElementById(&#x27;knob&#x27;),
      needle=document.getElementById(&#x27;needle&#x27;),knobnum=document.getElementById(&#x27;knobnum&#x27;),
      led=document.getElementById(&#x27;led&#x27;);

  function ang(i){return A0+i*STEP;}
  function radius(){return (dialEl.clientWidth||176)/2;}
  function place(){
    var R=radius(),rm=R-9,rl=(knob.offsetWidth/2)+7;
    [].forEach.call(dialEl.querySelectorAll(&#x27;.mark&#x27;),function(el,i){
      var a=(ang(i)-90)*Math.PI/180;
      el.style.left=&#x27;calc(50% + &#x27;+Math.cos(a)*rm+&#x27;px)&#x27;;
      el.style.top=&#x27;calc(50% + &#x27;+Math.sin(a)*rm+&#x27;px)&#x27;;
      el.style.transform=&#x27;rotate(&#x27;+ang(i)+&#x27;deg)&#x27;;
    });
    var rOut=R-15;
    [].forEach.call(dialEl.querySelectorAll(&#x27;.tick&#x27;),function(el,i){
      var A=ang(i),a=(A-90)*Math.PI/180,left=A&lt;0;
      el.style.left=&#x27;calc(50% + &#x27;+Math.cos(a)*rOut+&#x27;px)&#x27;;
      el.style.top=&#x27;calc(50% + &#x27;+Math.sin(a)*rOut+&#x27;px)&#x27;;
      el.style.transform=&#x27;translate(&#x27;+(left?&#x27;0&#x27;:&#x27;-100%&#x27;)+&#x27;,-50%) rotate(&#x27;+(left?A+90:A-90)+&#x27;deg)&#x27;;
      el.style.transformOrigin=left?&#x27;0% 50%&#x27;:&#x27;100% 50%&#x27;;
    });
    fitLabels(rOut,dialEl.clientWidth);
  }
  function fitLabels(rOut,dialW){
    var ticks=dialEl.querySelectorAll(&#x27;.tick&#x27;),GAP=6;
    if(!ticks.length)return;
    if(getComputedStyle(ticks[1]).opacity===&#x27;0&#x27;){
      knob.style.width=knob.style.height=knob.style.left=knob.style.top=&#x27;&#x27;;
      var n0=knob.querySelector(&#x27;b&#x27;);if(n0)n0.style.fontSize=&#x27;&#x27;;
      return;
    }
    var d=dialW*0.36,kr=d/2,room=rOut-kr-GAP,probe=12,widest=0;
    knob.style.width=knob.style.height=d+&#x27;px&#x27;;
    knob.style.left=knob.style.top=((dialW-d)/2)+&#x27;px&#x27;;
    var num=knob.querySelector(&#x27;b&#x27;);if(num)num.style.fontSize=Math.max(11,d*0.22)+&#x27;px&#x27;;
    var fs=probe;
    for(var it=0;it&lt;4;it++){
      [].forEach.call(ticks,function(el){el.style.fontSize=fs+&#x27;px&#x27;;});
      widest=0;
      [].forEach.call(ticks,function(el){widest=Math.max(widest,el.offsetWidth);});
      if(widest&lt;1)return;
      var next=Math.max(8.6,Math.min(22,fs*room/widest));
      if(Math.abs(next-fs)&lt;0.15){fs=next;break;}
      fs=next;
    }
    [].forEach.call(ticks,function(el){el.style.fontSize=fs+&#x27;px&#x27;;});
  }

  (function buildTicks(){
    POS.forEach(function(p,i){
      var m=document.createElement(&#x27;div&#x27;);m.className=&#x27;mark&#x27;;dialEl.appendChild(m);
      var el=document.createElement(&#x27;button&#x27;);
      el.className=&#x27;tick&#x27;+(ang(i)&lt;0?&#x27; flip&#x27;:&#x27;&#x27;);el.setAttribute(&#x27;data-i&#x27;,i);el.type=&#x27;button&#x27;;
      el.textContent=p.s;
      el.onclick=function(){select(i);};
      dialEl.appendChild(el);
    });
    place();
  })();

  function paintTicks(){
    [].forEach.call(dialEl.querySelectorAll(&#x27;.tick&#x27;),function(el,i){
      el.className=&#x27;tick&#x27;+(ang(i)&lt;0?&#x27; flip&#x27;:&#x27;&#x27;)+(i===pos?(POS[i].msg?&#x27; act&#x27;:&#x27; cur&#x27;):(i===chase?&#x27; hl&#x27;:&#x27;&#x27;));
    });
    [].forEach.call(dialEl.querySelectorAll(&#x27;.mark&#x27;),function(el,i){
      el.className=&#x27;mark&#x27;+(i===pos?&#x27; cur&#x27;:(i===chase?&#x27; hl&#x27;:&#x27;&#x27;));
    });
    var lg=document.getElementById(&#x27;legend&#x27;),j=(chase&gt;=0?chase:pos);
