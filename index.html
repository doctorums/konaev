<title>konaev.tv — кабельное телевидение Конаева</title>

<script src="i18n/kk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15110E;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1248px;height:832px;flex:none;transform-origin:50% 50%;overflow:hidden;
  --sky:linear-gradient(180deg,#F2C230 0%,#E39A4A 30%,#C8674A 52%,#7A5A72 75%,#33345C 100%);
  --water:linear-gradient(180deg,#3E5A78 0%,#24405E 55%,#16283E 100%);
  --sun:#FCEBB0;--sunglow:rgba(252,235,176,.5);--sunop:1;--suntop:40%;
  --hline:rgba(255,214,140,.55);--dim:rgba(24,16,8,.16)}
.lay{position:absolute;inset:0}
#stage{background:#F5EFE2 radial-gradient(ellipse at 50% 40%,#FBF7EE 0%,#F1E9D8 70%,#E8DDC6 100%)}
#stage:before{content:"";position:absolute;inset:0;z-index:0;opacity:.35;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(120,100,70,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,100,70,.04) 0 1px,transparent 1px 4px)}
#cam{position:absolute;inset:0;transform-origin:842px 466px}
#lines .fl{fill:#1E1A16}
#lines .ln{fill:none;stroke:#1E1A16;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len) var(--len);stroke-dashoffset:0;opacity:0}
.pre:not(.play) #cam{opacity:0}
.play #lines .ln{animation:draw var(--d) cubic-bezier(.4,0,.2,1) var(--t) both, lnout .8s ease 4.1s both}
.play #lines .fl{animation:flin .9s ease 2.9s both}
@keyframes draw{from{stroke-dashoffset:var(--len);opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes lnout{from{opacity:1}to{opacity:0}}
@keyframes flin{from{opacity:0}to{opacity:1}}
.play .rev:not(.lay){animation:revealR 1.2s cubic-bezier(.5,0,.3,1) 4.1s both}
.play .lay.rev{animation:reveal 1.2s cubic-bezier(.5,0,.3,1) 5.3s both}
@keyframes revealR{from{clip-path:inset(0 0 0 100%);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.play .scrin{animation:scrin .9s ease 6.3s both}
@keyframes scrin{from{opacity:0}to{opacity:1}}
.play #cam{animation:cam 3.4s cubic-bezier(.45,0,.15,1) 7.4s both}
@keyframes cam{
  0%{transform:perspective(1400px) rotateY(0deg) translate(0,0) scale(1)}
  100%{transform:perspective(1400px) rotateY(-6deg) translate(-218px,-50px) scale(3.8)}}
@media (prefers-reduced-motion: reduce){.play #lines .ln,.play #lines .fl,.play .rev,.play .scrin,.play #cam{animation:none!important}}

/* подсказка «нажмите, чтобы пропустить» — только тем, кто уже заходил */
#skip{position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:46;
  padding:.45rem .9rem;border-radius:999px;background:rgba(30,26,22,.55);color:#F5EFE2;
  font:600 .8rem/1.2 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.02em;white-space:nowrap;
  pointer-events:none;opacity:0;transition:opacity .5s}
#skip.on{opacity:1}
@keyframes loadbar{0%{width:8%}100%{width:82%}}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){.bar i,.scr{animation:none!important}}
</style>

*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--room);color:var(--ink);font-family:&#x27;Golos Text&#x27;,&#x27;Segoe UI&#x27;,Tahoma,sans-serif;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

.display{font-family:&#x27;Unbounded&#x27;,&#x27;Trebuchet MS&#x27;,sans-serif}

.page{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:.5rem .5rem 1rem}

/* ─── корпус ─── */
.ant{display:block;width:clamp(120px,30vw,210px);margin-bottom:-6px;overflow:hidden}
.tv{
  width:100%;max-width:100%;
  display:flex;flex-direction:column;gap:.6rem;
  padding:.7rem;border-radius:20px 20px 10px 10px;
  background:linear-gradient(160deg,var(--wood-hi),var(--wood) 42%,var(--wood-edge));
  border:3px solid var(--wood-edge);
  box-shadow:0 14px 30px rgba(0,0,0,.35)
}
.tube{flex:0 0 auto;width:100%;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.bezel{width:100%;aspect-ratio:4/3;max-height:calc(100dvh - 13.5rem);padding:.5rem;border-radius:18px;background:var(--bezel);box-shadow:inset 0 2px 6px rgba(255,255,255,.08)}
.screen{position:relative;width:100%;height:100%;border-radius:36px/24px;overflow:hidden;background:#0E1A38;color:#F3EBDD;touch-action:none;box-shadow:inset 0 0 55px rgba(0,0,0,.65)}

/* ─── панель управления в корпусе ─── */
.ctrl-panel{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.7rem;padding:.25rem .7rem}
.pleft{flex:1 1 46%;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.pright{flex:1 1 54%;min-width:0;max-width:13rem;display:flex;flex-direction:column;align-items:center;gap:.55rem}
.sp{display:none}

/* круглый переключатель */
.dial{position:relative;width:100%;max-width:11.6rem;aspect-ratio:1;flex:none;touch-action:none}
.dial .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,transparent 68%,var(--wood-edge) 69%)}
.tick{position:absolute;display:flex;align-items:center;gap:.22rem;padding:.1rem .15rem;border-radius:4px;background:none;cursor:pointer;
  color:var(--plate);font-size:.55rem;font-weight:700;letter-spacing:.01em;line-height:1;white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.7);transition:color .25s ease,opacity .25s ease,text-shadow .25s ease;opacity:.7}
.tick.flip{flex-direction:row-reverse}
.tick.cur{color:#F2C230;opacity:1;text-shadow:0 0 8px rgba(242,194,48,.55),0 1px 0 rgba(0,0,0,.7)}
.tick.act{color:#8FD98A;opacity:1;text-shadow:0 0 8px rgba(143,217,138,.5),0 1px 0 rgba(0,0,0,.7)}
.tick.hl{color:#EDE6D6;opacity:1;text-shadow:0 0 6px rgba(237,230,214,.35),0 1px 0 rgba(0,0,0,.7)}
.legend{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-top:.15rem;min-height:1.3rem;padding:.15rem .5rem;border-radius:4px;background:var(--wood-edge);box-shadow:inset 0 1px 3px rgba(0,0,0,.65);font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#F2C230;text-align:center;text-shadow:0 0 6px rgba(242,194,48,.4)}
.legend.act{color:#8FD98A}
.mark{position:absolute;width:2px;height:7px;margin:-3.5px 0 0 -1px;border-radius:1px;background:var(--plate);opacity:.45}
.mark.cur{opacity:1;width:3px;height:10px;margin-top:-5px;margin-left:-1.5px;background:#F2C230;box-shadow:0 0 7px rgba(242,194,48,.8)}
.mark.hl{opacity:1;background:#EDE6D6;box-shadow:0 0 6px rgba(237,230,214,.5)}
.mark{transition:height .2s,opacity .2s,background .2s}
.dial.chasing .tick{transition:color .85s ease,opacity .85s ease}
.knob{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#F2EAD6,var(--plastic) 46%,#8E8271);
  border:4px solid var(--wood-edge);box-shadow:0 4px 10px rgba(0,0,0,.5);cursor:grab}
.knob:active{cursor:grabbing}
.knob i{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .22s cubic-bezier(.34,1.5,.5,1)}
.knob i:after{content:&quot;&quot;;position:absolute;left:50%;top:9%;width:4px;height:26%;margin-left:-2px;background:#2B1F14;border-radius:2px}
.knob b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:&#x27;Unbounded&#x27;,&#x27;Trebuchet MS&#x27;,sans-serif;font-weight:700;font-size:1rem;color:#2B1F14}


/* горизонтальный ползунок громкости */
.vol-slider{position:relative;width:100%;max-width:none;height:2.1rem;flex:none;border-radius:7px;background:var(--wood-edge);padding:0 .5rem;cursor:pointer;touch-action:none;display:flex;align-items:center;justify-content:space-between}
.vol-slider .track{position:absolute;left:.5rem;right:.5rem;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:#120C07;box-shadow:inset 0 1px 3px rgba(0,0,0,.8)}
.vol-slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#B5772A,#E5B52E)}
.vol-slider .grip{position:absolute;top:50%;width:1rem;height:1.5rem;margin-top:-.75rem;border-radius:3px;background:linear-gradient(180deg,#F1E8D2,var(--plastic) 55%,#9E937E);border-bottom:2px solid var(--plastic-edge);box-shadow:0 2px 4px rgba(0,0,0,.5);transition:left .12s}
.vol-slider .grip:after{content:&quot;&quot;;position:absolute;top:4px;bottom:4px;left:50%;width:2px;margin-left:-1px;background:rgba(0,0,0,.35)}
.vol-slider span{position:relative;z-index:2;font-family:&#x27;Pixelify Sans&#x27;,&#x27;Courier New&#x27;,monospace;font-size:.6rem;color:var(--plate);opacity:.85}

.pw{flex:1;max-width:8rem;min-width:4.4rem;min-height:2.6rem;padding:0 .7rem;border-radius:7px;background:linear-gradient(180deg,#F1E8D2,var(--plastic) 55%,#A79B85);color:var(--plastic-txt);border-bottom:4px solid var(--plastic-edge);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.pw:active{transform:translateY(3px);border-bottom-width:1px}
.pw.is-off{background:linear-gradient(180deg,#cfc6b4,#9e937e 55%,#7a705e);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.led{width:10px;height:10px;border-radius:50%;background:#E0543C;box-shadow:0 0 7px rgba(224,84,60,.8)}
.led.off{background:#4A2018;box-shadow:none}

.stage{position:absolute;inset:0;container-type:size;overflow:hidden}

.js .ch{position:absolute;inset:0;display:none}
.js .ch.on{display:flex}
h1,h2{margin:0;font-family:&#x27;Unbounded&#x27;,&#x27;Trebuchet MS&#x27;,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.08;color:#F2C230}
h1{font-size:clamp(1.5rem,4.6vw,3.2rem);font-size:clamp(.95rem,8.2cqh,5.5rem)}

/* «Главный»: чего у нас нет — короткий список под описанием */

/* ── канал 6 · Эхо эфира ── */
/* Каркас канала неподвижен: у каждого блока своё постоянное место, при смене
   эха меняется только кегль фразы (подбирает echoFit), а не высота блоков. */
.echo{justify-content:flex-start!important;text-align:left}
/* верх канала — ниже часов, иначе заголовок под ними. .clock лежит вне .stage
   (контейнера), и его 4cqh считаются от окна — поэтому здесь 4svh, не 4cqh. */
.ch.echo{padding-top:calc(.8rem + 1.25*clamp(.66rem,4svh,1.7rem))}
/* То же для всех каналов: на телефоне в вертикали заголовки центрированных
   каналов заезжали под часы и кнопку ҚАЗ/РУС. Настроечная таблица — ниже,
   у неё своя раскладка (полосы во весь экран). */
.stage .ch:not(.card){padding-top:calc(.8rem + 1.25*clamp(.66rem,4svh,1.7rem))}
/* Табличка ночного канала — в свободной полосе между верхней строкой и
   бегущей строкой, не выше и не ниже; текст ужимается под размер экрана. */
.card .box{top:calc(50% + (.8rem + 1.25*clamp(.66rem,4svh,1.7rem) - clamp(1.5rem,4.4vmin,3.4rem))/2);
  max-height:calc(100% - (.8rem + 1.25*clamp(.66rem,4svh,1.7rem)) - clamp(1.5rem,4.4vmin,3.4rem) - .6rem);overflow:hidden}
.card .box h2{font-size:clamp(1rem,7cqh,2.4rem)}
.card .box p{font-size:clamp(.7rem,3.8cqh,1rem)!important}
/* Если содержимое не влезает, центрирование выталкивает верх под часы —
   «safe» в таком случае прижимает к верху и даёт прокрутку. */
.stage .ch{justify-content:safe center}
/* Телефон (вертикаль, а также низкая горизонталь): плотнее шаги и кнопки,
   чтобы «Подключить» влезал целиком. */
@media (orientation:portrait) and (max-width:600px),(max-height:500px){
  .ch{gap:clamp(.2rem,1.6cqh,.8rem)}
  /* снизу — ровно высота бегущей строки и небольшой зазор */
  .stage .ch:not(.card){padding-bottom:calc(clamp(1.5rem,4.4vmin,3.4rem) + .6rem)}
  .steps{gap:max(.15rem,1cqh);line-height:1.25}
  .ch p{line-height:1.25}
  .steps li{gap:.35rem}
  .steps b{min-width:.9rem}
  .ch .row{margin-top:0}
  .small{font-size:clamp(.56rem,2.8cqh,1rem)!important;line-height:1.25}
  /* кнопки в один ряд: длинная подпись переносится внутри кнопки */
  .ch .row{flex-wrap:nowrap}
  .ch .row .btn{flex:0 1 auto;min-width:0;text-align:center;line-height:1.15;padding:.2rem .55rem}
  /* «Главный» с тремя «нет»: заголовок и список мельче */
  .ch[data-n=&quot;01&quot;] h1{font-size:clamp(.78rem,6.4cqh,2.4rem)}
  .ch .nos p{font-size:clamp(.6rem,3.6cqh,1.1rem);line-height:1.2}
  /* «Важное» — справка из шести строк: плотнее */
  .ch[data-n=&quot;05&quot;]{gap:clamp(.15rem,1.2cqh,.6rem)}
  .ch[data-n=&quot;05&quot;] p{line-height:1.2}
}
/* совсем маленькие экраны: подсказку про пульт убираем — её повторяет бегущая строка */
@media (orientation:portrait) and (max-height:700px),(max-height:440px){
  .ch[data-n=&quot;01&quot;] .cy{display:none}
  .steps{line-height:1.15;gap:.12rem}

}

&lt;script&gt;
window.onerror=function(m,s,l){var e=document.getElementById(&#x27;err&#x27;);e.style.display=&#x27;block&#x27;;e.textContent=&#x27;Ошибка: &#x27;+m+&#x27; (строка &#x27;+l+&#x27;)&#x27;;};
(function(){
  var screen=document.getElementById(&#x27;screen&#x27;);
  var chans=[].slice.call(document.querySelectorAll(&#x27;.ch&#x27;));
  var osd=document.getElementById(&#x27;osd&#x27;),volEl=document.getElementById(&#x27;vol&#x27;),volBars=document.getElementById(&#x27;volbars&#x27;);
  var noise=document.getElementById(&#x27;noise&#x27;),ctx=noise.getContext(&#x27;2d&#x27;);
  var reduce=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  var cur=1,busy=false,vol=0,ac=null,osdT=null,volT=null,backT=null;

  /* позиции переключателя: 6 каналов + звонок */
  var chase=-1,chaseT=null,idleT=null;
  var POS=[
    {t:&#x27;1&#x27;,s:&#x27;главный&#x27;,go:1},
    {t:&#x27;2&#x27;,s:&#x27;подключить&#x27;,go:2},
    {t:&#x27;3&#x27;,s:&#x27;родителям&#x27;,go:3},
    {t:&#x27;4&#x27;,s:&#x27;ремонт&#x27;,go:4},
    {t:&#x27;5&#x27;,s:&#x27;важное&#x27;,go:5},
    {t:&#x27;6&#x27;,s:&#x27;эхо эфира&#x27;,go:6},
    {t:&#x27;T&#x27;,s:&#x27;позвонить&#x27;,msg:&#x27;8 (72772) 4-61-37&#x27;,tel:&#x27;tel:+77277246137&#x27;}
  ];
  var STEP=40, A0=-(STEP*(POS.length-1))/2, pos=0;
  var baseFS=12;
  var dialEl=document.getElementById(&#x27;dial&#x27;),knob=document.getElementById(&#x27;knob&#x27;),
      needle=document.getElementById(&#x27;needle&#x27;),knobnum=document.getElementById(&#x27;knobnum&#x27;),
      led=document.getElementById(&#x27;led&#x27;);

  function ang(i){return A0+i*STEP;}
  function radius(){return (dialEl.clientWidth||176)/2;}
  function place(){
    var R=radius(),rm=R-9,rl=(knob.offsetWidth/2)+7;
    [].forEach.call(dialEl.querySelectorAll(&#x27;.mark&#x27;),function(el,i){
      var a=(ang(i)-90)*Math.PI/180;
      el.style.left=&#x27;calc(50% + &#x27;+Math.cos(a)*rm+&#x27;px)&#x27;;
      el.style.top=&#x27;calc(50% + &#x27;+Math.sin(a)*rm+&#x27;px)&#x27;;
      el.style.transform=&#x27;rotate(&#x27;+ang(i)+&#x27;deg)&#x27;;
    });
    var rOut=R-15;
    [].forEach.call(dialEl.querySelectorAll(&#x27;.tick&#x27;),function(el,i){
      var A=ang(i),a=(A-90)*Math.PI/180,left=A&lt;0;
      el.style.left=&#x27;calc(50% + &#x27;+Math.cos(a)*rOut+&#x27;px)&#x27;;
      el.style.top=&#x27;calc(50% + &#x27;+Math.sin(a)*rOut+&#x27;px)&#x27;;
      el.style.transform=&#x27;translate(&#x27;+(left?&#x27;0&#x27;:&#x27;-100%&#x27;)+&#x27;,-50%) rotate(&#x27;+(left?A+90:A-90)+&#x27;deg)&#x27;;
      el.style.transformOrigin=left?&#x27;0% 50%&#x27;:&#x27;100% 50%&#x27;;
    });
    fitLabels(rOut,dialEl.clientWidth);
  }
  function fitLabels(rOut,dialW){
    var ticks=dialEl.querySelectorAll(&#x27;.tick&#x27;),GAP=6;
    if(!ticks.length)return;
    if(getComputedStyle(ticks[1]).opacity===&#x27;0&#x27;){
      knob.style.width=knob.style.height=knob.style.left=knob.style.top=&#x27;&#x27;;
      var n0=knob.querySelector(&#x27;b&#x27;);if(n0)n0.style.fontSize=&#x27;&#x27;;
      return;
    }
    var d=dialW*0.34,kr=d/2,room=rOut-kr-GAP,probe=12,widest=0,BOOST=1.18;
    knob.style.width=knob.style.height=d+&#x27;px&#x27;;
    knob.style.left=knob.style.top=((dialW-d)/2)+&#x27;px&#x27;;
    var num=knob.querySelector(&#x27;b&#x27;);if(num)num.style.fontSize=Math.max(11,d*0.22)+&#x27;px&#x27;;
    var fs=probe;
    /* Кегль подбираем по русским подписям на любом языке: иначе казахские
       (другой длины) давали другой размер букв. Переводы короче или равны. */
    var shown=[].map.call(ticks,function(el){return el.textContent;});
    [].forEach.call(ticks,function(el,i){el.textContent=POS[i].s;});
    for(var it=0;it&lt;4;it++){
      [].forEach.call(ticks,function(el){el.style.fontSize=fs+&#x27;px&#x27;;});
      widest=0;
      [].forEach.call(ticks,function(el){widest=Math.max(widest,el.offsetWidth);});
      if(widest&lt;1){[].forEach.call(ticks,function(el,i){el.textContent=shown[i];});return;}
      var next=Math.max(8.6,Math.min(22,fs*room/(widest*BOOST)));
      if(Math.abs(next-fs)&lt;0.15){fs=next;break;}
      fs=next;
    }
    [].forEach.call(ticks,function(el,i){el.textContent=shown[i];el.style.fontSize=fs+&#x27;px&#x27;;});
    baseFS=fs;paintTicks();
  }

  (function buildTicks(){
    POS.forEach(function(p,i){
      var m=document.createElement(&#x27;div&#x27;);m.className=&#x27;mark&#x27;;dialEl.appendChild(m);
      var el=document.createElement(&#x27;button&#x27;);
      el.className=&#x27;tick&#x27;+(ang(i)&lt;0?&#x27; flip&#x27;:&#x27;&#x27;);el.setAttribute(&#x27;data-i&#x27;,i);el.type=&#x27;button&#x27;;
      el.textContent=p.s;
      el.onclick=function(){select(i);};
      dialEl.appendChild(el);
    });
    place();
  })();

  function paintTicks(){
    [].forEach.call(dialEl.querySelectorAll(&#x27;.tick&#x27;),function(el,i){
      el.className=&#x27;tick&#x27;+(ang(i)&lt;0?&#x27; flip&#x27;:&#x27;&#x27;)+(i===pos?(POS[i].msg?&#x27; act&#x27;:&#x27; cur&#x27;):(i===chase?&#x27; hl&#x27;:&#x27;&#x27;));
      if(baseFS)el.style.fontSize=(i===pos?baseFS*1.18:baseFS)+&#x27;px&#x27;;
    });
    [].forEach.call(dialEl.querySelectorAll(&#x27;.mark&#x27;),function(el,i){
      el.className=&#x27;mark&#x27;+(i===pos?&#x27; cur&#x27;:(i===chase?&#x27; hl&#x27;:&#x27;&#x27;));
    });
    var lg=document.getElementById(&#x27;legend&#x27;),j=(chase&gt;=0?chase:pos);

  function rowMode(){
    return window.matchMedia(&#x27;(min-width:900px) and (min-aspect-ratio:21/20)&#x27;).matches ||
           window.matchMedia(&#x27;(orientation:landscape) and (max-width:899px)&#x27;).matches;
  }
  function fit(){
    if(!rowMode()){
      tubeEl.style.width=&#x27;&#x27;;tubeEl.style.height=&#x27;&#x27;;
      pageEl.style.removeProperty(&#x27;--panel&#x27;);
      place();return;
    }
    tubeEl.style.width=&#x27;&#x27;;tubeEl.style.height=&#x27;&#x27;;
    var cs=getComputedStyle(tvEl),
        padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight),
        padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),
        gap=parseFloat(cs.columnGap||cs.gap)||0,
        bord=parseFloat(cs.borderLeftWidth)*2,
        legsEl=document.querySelector(&#x27;.legs&#x27;),
        ps=getComputedStyle(pageEl),
        availW=pageEl.clientWidth-parseFloat(ps.paddingLeft)-parseFloat(ps.paddingRight)-padX-bord-gap-4,
        hAvail=setEl.clientHeight-(legsEl?legsEl.offsetHeight:0),
        hTube=Math.min(hAvail-padY,1000),
        narrow=window.innerWidth&lt;900,
        panel=narrow?152:Math.max(260,Math.min(Math.min(hAvail,1060)*0.48,440));
    if(panel&gt;availW*0.40)panel=Math.max(narrow?110:150,availW*0.40);
    var maxByH=(hTube-24)/1.78;
    if(panel&gt;maxByH)panel=maxByH;
    var compact=panel&lt;170;
    if(compact)panel=Math.max(96,Math.min(panel===maxByH?(hTube-24)/1.52:panel,(hTube-24)/1.52));
    panelEl.className=&#x27;ctrl-panel&#x27;+(compact?&#x27; compact&#x27;:&#x27;&#x27;);
    var w=Math.min(hTube*4/3,availW-panel);
    if(w&lt;40){panel=Math.max(110,availW*0.32);w=Math.max(40,availW-panel);}
    hTube=Math.min(hTube,w*3/4);
    pageEl.style.setProperty(&#x27;--panel&#x27;,Math.round(panel)+&#x27;px&#x27;);
    tubeEl.style.width=Math.round(w)+&#x27;px&#x27;;
    tubeEl.style.height=Math.round(hTube)+&#x27;px&#x27;;
    place();
    guard();
  }
  function guard(){
    for(var i=0;i&lt;3;i++){
      var tvR=tvEl.getBoundingClientRect(),pR=panelEl.getBoundingClientRect();
      var over=Math.max(pR.bottom-tvR.bottom,pR.right-tvR.right);
      if(over&lt;=1)return;
      var cur=parseFloat(getComputedStyle(pageEl).getPropertyValue(&#x27;--panel&#x27;))||panelEl.offsetWidth;
      var next=Math.max(96,cur-Math.max(12,over));
      pageEl.style.setProperty(&#x27;--panel&#x27;,Math.round(next)+&#x27;px&#x27;);
      panelEl.className=&#x27;ctrl-panel&#x27;+(next&lt;170?&#x27; compact&#x27;:&#x27;&#x27;);
      place();
    }
  }
  (function crawlStatic(){
    if(!reduce)return;
    var el=document.getElementById(&#x27;crawl&#x27;);if(!el)return;
    el.parentNode.className=&#x27;crawl static&#x27;;
    /* Список спанов берём заново на каждом шаге: на канале эха crawlSet меняет
       содержимое строки. */
    var k=0;
    function half(){var all=[].slice.call(el.querySelectorAll(&#x27;span&#x27;));return all.slice(0,Math.max(1,all.length/2));}
    var h0=half();if(!h0.length)return;
    h0[0].className+=&#x27; show&#x27;;
    setInterval(function(){
      var h=half();
      h.forEach(function(s){s.className=s.className.replace(&#x27; show&#x27;,&#x27;&#x27;);});
      k=(k+1)%h.length;
      h[k].className+=&#x27; show&#x27;;
    },6000);
  })();

  (function crawlFallback(){
    var el=document.getElementById(&#x27;crawl&#x27;);
    if(!el||reduce)return;
    setTimeout(function(){
      var a=el.getBoundingClientRect().left;
      setTimeout(function(){
        if(Math.abs(el.getBoundingClientRect().left-a)&gt;0.5)return; /* CSS-анимация работает */
        el.style.animation=&#x27;none&#x27;;
        /* Ширину круга меряем каждый кадр: crawlSet на канале эха меняет
           содержимое. Скорость — постоянная, по исходной строке слоганов. */
        var x=0,speed=(el.scrollWidth/2||1)/78000,last=0;
        (function step(t){
          if(last){var w=el.scrollWidth/2||1;x-=(t-last)*speed;while(-x&gt;=w)x+=w;el.style.transform=&#x27;translate3d(&#x27;+x+&#x27;px,0,0)&#x27;;}
          last=t;requestAnimationFrame(step);
        })(0);
      },900);
    },600);
  })();

  /* echoFit — после fit: размер экрана меняется, кегль фразы эха пересчитываем */
  function fitAll(){fit();echoFit();}
  window.addEventListener(&#x27;resize&#x27;,fitAll);
  window.addEventListener(&#x27;orientationchange&#x27;,function(){setTimeout(fitAll,120);});
  fit();setTimeout(fit,60);setTimeout(fitAll,400);
  window.addEventListener(&#x27;load&#x27;,fitAll);
  if(document.fonts&amp;&amp;document.fonts.ready){document.fonts.ready.then(function(){fitAll();});}
})();
&lt;/script&gt;

" style="position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;z-index:40;opacity:0;pointer-events:none;background:#F3EBDD"></iframe>
<div id="skip" hidden>Нажмите, чтобы пропустить</div>
<canvas id="snow" width="200" height="120" style="position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:45;opacity:0;pointer-events:none;image-rendering:pixelated"></canvas>
<script>
(function(){
  var st=document.getElementById('stage');

  /* Язык заставки — по тем же правилам, что у сайта внутри (setLang там же
     потом ведёт заголовок вкладки): ?lang= → сохранённый выбор → устройство. */
  (function introLang(){
    var d=window.KONAEV_KK;if(!d)return;
    var l=null,m=location.search.match(/[?&]lang=(kk|kz|ru)\b/);
    if(m)l=m[1]==='ru'?'ru':'kk';
    if(!l){try{l=localStorage.getItem('lang');}catch(e){}}
    if(!l){var ls=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'ru'];
      for(var i=0;i<ls.length&&!l;i++){var x=String(ls[i]).toLowerCase();if(x.indexOf('kk')===0||x.indexOf('kz')===0)l='kk';else if(x.indexOf('ru')===0)l='ru';}}
    if(l!=='kk')return;
    document.documentElement.lang='kk';
    if(d[document.title])document.title=d[document.title];
    var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),n,t;
    while((n=w.nextNode())){t=n.nodeValue.replace(/\s+/g,' ').trim();if(d[t]!=null)n.nodeValue=d[t];}
  })();

  var STATES={
    night:{sky:'linear-gradient(180deg,#0E1430 0%,#151B3A 40%,#1E2044 70%,#241F3E 100%)',
      water:'linear-gradient(180deg,#152743 0%,#0F1C33 55%,#0A1424 100%)',
      sun:'#EAF0FF',glow:'rgba(210,225,255,.30)',sunop:'.75',suntop:'16%',
      hline:'rgba(180,200,255,.25)',dim:'rgba(10,14,28,.52)',plantlit:'0.42',plantsat:'0.55'},
    dawn:{sky:'linear-gradient(180deg,#8FA8C8 0%,#D7A98C 34%,#E8B27A 56%,#B98A86 78%,#5B5C80 100%)',
      water:'linear-gradient(180deg,#43607E 0%,#2A4763 55%,#1A2E45 100%)',
      sun:'#FFE9C4',glow:'rgba(255,233,196,.42)',sunop:'.9',suntop:'52%',
      hline:'rgba(255,220,170,.45)',dim:'rgba(20,20,34,.30)',plantlit:'0.78',plantsat:'0.9'},
    day:{sky:'linear-gradient(180deg,#7FB2DA 0%,#A8CBE4 42%,#CBDCE8 68%,#D9DDDD 100%)',
      water:'linear-gradient(180deg,#4B7398 0%,#2F587C 55%,#1F3C58 100%)',
      sun:'#FFFDF2',glow:'rgba(255,253,242,.45)',sunop:'.95',suntop:'12%',
      hline:'rgba(255,255,255,.35)',dim:'rgba(24,20,10,.10)',plantlit:'1',plantsat:'1'},
    sunset:{sky:'linear-gradient(180deg,#F2C230 0%,#E39A4A 28%,#C8674A 48%,#7A5A72 70%,#33345C 100%)',
      water:'linear-gradient(180deg,#3E5A78 0%,#24405E 55%,#16283E 100%)',
      sun:'#FCEBB0',glow:'rgba(252,235,176,.45)',sunop:'1',suntop:'34%',
      hline:'rgba(255,214,140,.5)',dim:'rgba(28,18,8,.22)',plantlit:'0.92',plantsat:'1.05'},
    dusk:{sky:'linear-gradient(180deg,#4A3F63 0%,#5A4668 34%,#6B4A5E 54%,#3C3352 78%,#22213E 100%)',
      water:'linear-gradient(180deg,#2C4560 0%,#1C3348 55%,#11212F 100%)',
      sun:'#F3D9B5',glow:'rgba(243,217,181,.3)',sunop:'.55',suntop:'58%',
      hline:'rgba(240,200,160,.3)',dim:'rgba(16,14,24,.42)',plantlit:'0.55',plantsat:'0.7'}
  };
  function almatyHour(){
    try{return +new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',hour12:false,timeZone:'Asia/Almaty'}).format(new Date());}
    catch(e){return new Date().getHours();}
  }
  function applyTime(){
    var hr=almatyHour(),k;
    if(hr<5)k='night'; else if(hr<8)k='dawn'; else if(hr<17)k='day';
    else if(hr<20)k='sunset'; else if(hr<23)k='dusk'; else k='night';
    var s=STATES[k];
    st.style.setProperty('--sky',s.sky);
    st.style.setProperty('--water',s.water);
    st.style.setProperty('--sun',s.sun);
    st.style.setProperty('--sunglow',s.glow);
    st.style.setProperty('--sunop',s.sunop);
    st.style.setProperty('--suntop',s.suntop);
    st.style.setProperty('--hline',s.hline);
    st.style.setProperty('--dim',s.dim);
    var V={night:['0','1','brightness(.34) saturate(.55)','rgba(18,28,78,.52)'],
           dawn:['1','0','none','rgba(255,190,170,.10)'],
           day:['1','0','none','transparent'],
           sunset:['0','1','none','transparent'],
           dusk:['0','1','brightness(.62) saturate(.8)','rgba(70,40,110,.30)']}[k];
    st.style.setProperty('--vm',V[0]);st.style.setProperty('--vs',V[1]);
    st.style.setProperty('--vf',V[2]);st.style.setProperty('--vtint',V[3]);
    st.style.setProperty('--tvglow',{night:'.30',dawn:'.12',day:'0',sunset:'.06',dusk:'.2'}[k]);
    st.style.setProperty('--plantlit',s.plantlit);
    st.style.setProperty('--plantsat',s.plantsat);
  }

  /* ── переход в прототип ── */
  var fr=document.getElementById('proto'), snow=document.getElementById('snow'), sctx=snow.getContext('2d');
  var protoReady=false; fr.addEventListener('load',function(){protoReady=true;});
  function noise(ms,done){
    var t0=performance.now(); snow.style.opacity=1;
    (function f(t){
      var img=sctx.createImageData(200,120),d=img.data;
      for(var i=0;i<d.length;i+=4){var v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
      sctx.putImageData(img,0,0);
      if(t-t0<ms)requestAnimationFrame(f); else {snow.style.transition='opacity .25s';snow.style.opacity=0;setTimeout(function(){snow.style.transition='';},260);done&&done();}
    })(t0);
  }
  function zoomOf(){
    var d=fr.contentDocument, sc=d&&d.getElementById('screen'); if(!sc)return null;
    var r=sc.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
    var s=Math.max(vw/r.width, vh/r.height)*1.04, cx=r.left+r.width/2, cy=r.top+r.height/2;
    return {origin:cx+'px '+cy+'px', t:'translate('+(vw/2-cx)+'px,'+(vh/2-cy)+'px) scale('+s+')'};
  }
  function handoff(){
    if(handed)return;
    if(!protoReady){setTimeout(handoff,100);return;}
    handed=true; seen();
    var z=zoomOf(); if(!z){fr.style.opacity=1;fr.style.pointerEvents='auto';return;}
    fr.style.transformOrigin=z.origin; fr.style.transform=z.t;
    noise(420,function(){
      fr.style.opacity=1; document.getElementById('stage').style.visibility='hidden';
      var a=fr.animate([{transform:z.t},{transform:'none'}],{duration:2000,easing:'cubic-bezier(.35,0,.15,1)',fill:'forwards'});
      a.onfinish=function(){fr.style.transform='none';fr.style.pointerEvents='auto';};
    });
  }
  document.getElementById('cam').addEventListener('animationend',function(e){ if(e.animationName==='cam')setTimeout(handoff,500); });
  /* Кто уже заходил, может не ждать заставку: тап/клик/клавиша — сразу шум
     и главный канал, без наезда камеры. Отметка ставится, когда сайт показан. */
  var handed=false, skipEl=document.getElementById('skip'), wasSeen=false;
  try{wasSeen=localStorage.getItem('introSeen')==='1';}catch(e){}
  function seen(){
    try{localStorage.setItem('introSeen','1');}catch(e){}
    skipEl.classList.remove('on');
    document.removeEventListener('pointerdown',skip);document.removeEventListener('keydown',skip);
  }
  function skip(){
    if(handed)return;
    handed=true; seen();
    fr.getAnimations().forEach(function(a){a.cancel();});
    fr.style.transform='none';
    noise(450,function after(){
      if(!protoReady){noise(150,after);return;}
      fr.style.opacity=1; fr.style.pointerEvents='auto';
      document.getElementById('stage').style.visibility='hidden';
    });
  }
  if(wasSeen){
    document.addEventListener('pointerdown',skip);document.addEventListener('keydown',skip);
    skipEl.hidden=false; setTimeout(function(){if(!handed)skipEl.classList.add('on');},700);
  }
  function resetProto(){
    fr.getAnimations().forEach(function(a){a.cancel();});
    fr.style.opacity=0; fr.style.pointerEvents='none'; fr.style.transform='';
    document.getElementById('stage').style.visibility='';
  }

  applyTime();setInterval(applyTime,60000);
  var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(){ st.classList.remove('pre'); if(rm){ (function w(){ if(protoReady){handed=true;seen();fr.style.opacity=1;fr.style.pointerEvents='auto';document.getElementById('stage').style.visibility='hidden';} else setTimeout(w,100); })(); return; } if(!rm){st.classList.remove('play');void st.offsetWidth;st.classList.add('play');} }
  if(document.readyState==='complete')setTimeout(go,150); else window.addEventListener('load',function(){setTimeout(go,150);});
  function fit(){
    var s=Math.min(window.innerWidth/1248, window.innerHeight/832);
    st.style.transform='scale('+s+')';
  }
  window.addEventListener('resize',fit);fit();
})();
</script>
